name: jlpt-learn

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api-1
      - api-2
      - frontend
    restart: unless-stopped

  api-1: &api
    build:
      context: ./src/backend
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql://jlpt:jlpt_dev_password@postgres:5432/jlpt}
      APP_MINIO_ENDPOINT: ${APP_MINIO_ENDPOINT:-minio:9000}
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-jlpt-media}
      APP_REDIS_URL: redis://:${REDIS_PASSWORD:-jlpt_dev_password}@redis:6379/0
      APP_REDIS_ENABLED: ${APP_REDIS_ENABLED:-true}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_PER_MINUTE: ${APP_RATE_LIMIT_PER_MINUTE:-60}
      APP_RATE_LIMIT_WRITE_PER_MINUTE: ${APP_RATE_LIMIT_WRITE_PER_MINUTE:-20}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    <<: *api
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/usr/local/etc/redis/start-redis.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jlpt_dev_password}
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./infra/redis/start-redis.sh:/usr/local/etc/redis/start-redis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped

  # Postgres: chứa dữ liệu đề thi theo schema docs/data-contract.md
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jlpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jlpt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jlpt}
    volumes:
      - ./infra/postgres/init/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO: lưu media local theo cấu trúc data/minio/README.md
  minio:
    image: cgr.dev/chainguard/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # Công cụ backup/restore MinIO; không chạy cùng stack ứng dụng.
  minio-tools:
    build:
      context: .
      dockerfile: infra/minio-init/Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    profiles: [tools]

volumes:
  pgdata:
  minio_data:
