# Redis: dùng làm kho counter cho rate limit tầng ứng dụng.
#
# Redis KHÔNG được publish ra host (không có `ports:` trong docker-compose.yml),
# chỉ nội bộ trong docker network. `requirepass` được truyền qua lệnh start
# (xem docker-compose.yml) nên mật khẩu không nằm trong file này.

bind 0.0.0.0
protected-mode yes
port 6379

# Không ghi log toàn bộ lệnh (giảm overhead)
loglevel notice
logfile ""

save ""
appendonly no

# Rate limit counter sống ngắn -> không cần snapshot
maxmemory 256mb
maxmemory-policy allkeys-lru

timeout 0
tcp-keepalive 300
