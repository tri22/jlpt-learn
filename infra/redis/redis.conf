# Redis stores counters for application-level rate limiting.
#
# Redis MUST NOT be exposed to the host (there is no `ports:` entry in
# docker-compose.yml); it is internal to the Docker network. `requirepass` is
# provided by the startup command, so the password is not stored in this file.

bind 0.0.0.0
protected-mode yes
port 6379

# Do not log every command; this reduces overhead.
loglevel notice
logfile ""

save ""
appendonly no

# Rate-limit counters are short-lived and do not need snapshots.
maxmemory 256mb
maxmemory-policy allkeys-lru

timeout 0
tcp-keepalive 300
