server {
    listen 80;
    server_name _;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location ^~ /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header X-Request-Id      $request_id;
    }

    location ^~ /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req zone=api_key burst=60 nodelay;
        limit_req zone=api_write burst=10 nodelay;

        limit_conn per_ip 32;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location = /healthz {
        access_log off;
        proxy_pass http://backend_upstream/api/v1/health;
    }

    client_max_body_size 10m;

    # Media được phục vụ từ MinIO, không đọc dataset trên filesystem frontend.
    location ^~ /exams/ {
        proxy_pass http://minio:9000/jlpt-media/exams/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
