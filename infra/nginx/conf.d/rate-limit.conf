# Tầng 1 rate limit — theo IP, chặn ở edge trước khi request tới backend.
#
# Ghi chú: `limit_req` không được phép đặt trong `if`. Để siết riêng method ghi,
# ta dùng `map` để sinh key rỗng cho các method không bị giới hạn thêm.
# Key rỗng -> Nginx không tính request đó vào zone.

# Zone chung cho mọi request API
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# Zone riêng cho method ghi (POST/PUT/PATCH/DELETE)
map $request_method $write_limit_key {
    default    "";
    POST       $remote_addr;
    PUT        $remote_addr;
    PATCH      $remote_addr;
    DELETE     $remote_addr;
}
limit_req_zone $write_limit_key zone=api_write:10m rate=5r/s;

# Zone riêng cho nhóm auth — siết chặt hơn
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

# Zone theo API key cho client đã xác thực (biến $http_x_api_key).
# Header rỗng -> không bị tính vào zone này.
limit_req_zone $http_x_api_key zone=api_key:10m rate=30r/s;

# Chặn connection flood: tối đa 32 kết nối đồng thời mỗi IP
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

limit_req_status  429;
limit_req_log_level warn;
limit_conn_status 429;
