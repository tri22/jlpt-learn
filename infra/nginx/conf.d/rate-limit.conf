# Layer 1 rate limiting by IP blocks traffic at the edge before the backend.
#
# `limit_req` cannot be used inside `if`. A `map` generates an empty key for
# methods that do not need the additional write limit. Nginx does not count
# requests with an empty key in the zone.

# General zone for every API request
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# Separate zone for write methods (POST/PUT/PATCH/DELETE)
map $request_method $write_limit_key {
    default    "";
    POST       $remote_addr;
    PUT        $remote_addr;
    PATCH      $remote_addr;
    DELETE     $remote_addr;
}
limit_req_zone $write_limit_key zone=api_write:10m rate=5r/s;

# Stricter zone for authentication routes
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

# API-key zone for identified clients (`$http_x_api_key`).
# Requests with an empty header are not counted in this zone.
limit_req_zone $http_x_api_key zone=api_key:10m rate=30r/s;

# Limit connection floods to 32 concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

limit_req_status  429;
limit_req_log_level warn;
limit_conn_status 429;
